version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - export ECR_REPO=$AWS_ACCOUNT_ID.dkr.ecr.eu-central-1.amazonaws.com
      - aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin $ECR_REPO
  build:
    commands:
      - echo Building Docker image...
      - cd match-predictor
      - docker build -t match-predictor .
      - docker tag match-predictor:latest $ECR_REPO/match-predictor:latest
      - cd ..
  post_build:
    commands:
      - echo Pushing to ECR...
      - docker push $ECR_REPO/match-predictor:latest
      - echo Writing imagedefinitions.json...
      - printf '[{"name":"match-predictor","imageUri":"%s/match-predictor:latest"}]' "$ECR_REPO" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json