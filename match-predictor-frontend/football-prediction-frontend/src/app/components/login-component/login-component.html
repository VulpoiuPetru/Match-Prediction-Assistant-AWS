<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<div class="login-shell">
  <div class="login-card">
    
    <div class="login-header">
      <div class="login-logo">
        <span class="logo-icon">⚽</span>
        <span class="logo-text">Match<strong>AI</strong></span>
      </div>
      <p class="login-sub">Sign in to your account</p>
    </div>

    <div class="login-form">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input"
               type="text"
               [(ngModel)]="username"
               placeholder="admin or testuser"
               (keydown.enter)="login()" />
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input"
               type="password"
               [(ngModel)]="password"
               placeholder="••••••••"
               (keydown.enter)="login()" />
      </div>

      <div *ngIf="error" class="error-msg">{{ error }}</div>

      <button class="login-btn" [disabled]="loading || !username || !password" (click)="login()">
        <span *ngIf="loading" class="btn-spinner"></span>
        <span *ngIf="!loading">Sign In →</span>
        <span *ngIf="loading">Signing in…</span>
      </button>

      <div class="login-hints">
        <!-- <div class="hint"><span class="hint-role admin">ADMIN</span> admin / parola123</div>
        <div class="hint"><span class="hint-role user">USER</span> testuser / parola123</div> -->
      </div>
    </div>
  </div>
</div>
